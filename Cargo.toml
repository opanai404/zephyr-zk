[package]
name = "zephyr-zk"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["hrniu"]
license = "MIT"
description = "Zero-knowledge circuit toolkit with pluggable backends"
keywords = ["zero-knowledge", "zkp", "stark", "groth16", "circuit"]
categories = ["cryptography", "mathematics"]
readme = "README.md"
repository = "https://github.com/hrniu/zephyr-zk"

[dependencies]
# --- field arithmetic -------------------------------------------------------
ark-ff = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
ark-bn254 = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false }

# --- STARK backend (Plonky3-style univariate STARK over the field) ----------
ark-poly = { version = "0.5", default-features = false, optional = true }

# --- Groth16 backend (arkworks) --------------------------------------------
ark-groth16 = { version = "0.5", optional = true }
ark-relations = { version = "0.5", optional = true }

# --- WASM verifier ----------------------------------------------------------
wasm-bindgen = { version = "0.2", optional = true }

# --- dev tooling ------------------------------------------------------------
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[features]
default = ["stark"]
stark = ["dep:ark-poly"]
groth16 = ["dep:ark-groth16", "dep:ark-relations"]
wasm = ["dep:wasm-bindgen", "stark", "groth16"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "circuits"
harness = false

[[bench]]
name = "stark"
harness = false

[[bench]]
name = "groth16"
harness = false
required-features = ["groth16"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.release.package.zephyr-zk]
opt-level = 3

[package.metadata.docs.rs]
features = ["stark", "groth16", "wasm"]
